# سيرفر نَبْض (nabd-api) — نشر تلقائي من GitHub عبر Cloudflare Workers Builds
# التطبيق نفسه على GitHub Pages (nabd.wamdarc.com)، هذا الملف للسيرفر فقط.
# مفاتيح الإشعارات محفوظة في جدول config داخل قاعدة nabd، فما يحتاج متغيرات سرية.
name = "nabd-api"
main = "worker/worker.js"
compatibility_date = "2026-10-01"
workers_dev = true
keep_vars = true

[[d1_databases]]
binding = "DB"
database_name = "nabd"
database_id = "96b1fce2-6ab3-4180-9c03-bfe09baa7fda"

# جداول إحصائيات ومض آرك المشتركة (نفس قاعدة push-wamdarc) — للوحة admin.wamdarc.com
[[d1_databases]]
binding = "STATS"
database_name = "falaq"
database_id = "3cb52fee-bfc3-4ee8-a362-15f5788ec267"

# سجل رسائل سِراج (قراءة فقط) — لسجل الرسائل الكامل والنسخة الاحتياطية في لوحة الإدارة
[[d1_databases]]
binding = "SIRAJDB"
database_name = "siraj"
database_id = "6f6b4874-c611-4e63-a658-a5ea568af868"

# ربط مباشر بخادم سِراج للتحقق من مفتاح الإدارة (fetch العادي بين خوادم workers.dev ممنوع)
[[services]]
binding = "SIRAJ"
service = "siraj-api"

# تشغيل السيرفر قرب قاعدة البيانات = ردود وإشعارات أسرع
[placement]
mode = "smart"

[triggers]
crons = ["* * * * *"]

[observability]
enabled = true
