<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
<title>نَبْض | NABD</title>
<meta name="description" content="تواصل العائلة فقط: صوت وكتابة وصور ورسم">
<meta name="theme-color" content="#F4F7FC">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="نَبْض">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<script>try{var t=localStorage.getItem('nabd-theme')||'auto';var d=t==='dark'||(t==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.dataset.theme=d?'dark':'light';var m=document.querySelector('meta[name=theme-color]');if(m)m.content=d?'#0E1218':'#F4F7FC'}catch(e){}</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#F4F7FC;--card:#fff;--ink:#1B2333;--muted:#4A5468;--soft:#6B7489;--line:#E1E7F2;--line2:#EEF2F8;--chip:#E8EDF6;
  --accent:#0F8B8D;--accent-ink:#0B6E70;--accent-soft:#E6F4F4;--brand:#3C5BD6;--brand-ink:#2B3FA8;--brand-soft:#EEF1FD;
  --orange:#F26B1D;--orange-ink:#6B2E07;--orange-soft:#FFF1E8;--danger:#A3261B;--danger-soft:#FDECEA;--ok:#1F7A45;--warn:#9A4A00;
  --r:22px;--safe-t:env(safe-area-inset-top);--safe-b:env(safe-area-inset-bottom);
  --fd:'Baloo Bhaijaan 2','IBM Plex Sans Arabic',system-ui,sans-serif;--fb:'IBM Plex Sans Arabic',system-ui,-apple-system,sans-serif;
  --togoff:#CBD3E1;--wave:#C9D2E2;--warm-bg:#FFF4E5;--warm-ink:#6B3400;--draw-ink:#8A3A10;--photo-bg:#EAF1FC;--photo-ink:#1F4F9E;--txt-bg:#F4F7FC;
  color-scheme:light
}
/* الداكن: تلقائي حسب الجهاز، أو يدوي من الإعدادات */
:root[data-theme="dark"]{
  --bg:#0E1218;--card:#1A2029;--ink:#EEF1F6;--muted:#AEB7C7;--soft:#8C96A8;--line:#262E3A;--line2:#232A35;--chip:#262E3A;
  --accent:#14A3A5;--accent-ink:#7FDCDD;--accent-soft:#113A3B;--brand:#5B78F0;--brand-ink:#B3C0FF;--brand-soft:#1D2648;
  --orange-soft:#3A2416;--orange-ink:#FFCBA6;--danger:#FF8F85;--danger-soft:#3A1D1D;--ok:#62C892;--warn:#F0BA55;
  --togoff:#3A4352;--wave:#3E4757;--warm-bg:#33261A;--warm-ink:#FFD7A8;--draw-ink:#FFC29B;--photo-bg:#1C2A44;--photo-ink:#A9C4FF;
  color-scheme:dark
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}
*{touch-action:manipulation}
.drawwrap,.drawwrap canvas{touch-action:none}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:16px;line-height:1.5;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
*{-webkit-user-select:none;user-select:none}
input,textarea,select{-webkit-user-select:text!important;user-select:text!important;-webkit-touch-callout:default;font-size:max(16px,1em)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
a{color:var(--accent-ink)}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#app{max-width:560px;margin:0 auto;min-height:100%;position:relative}
.screen{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding:calc(var(--safe-t) + 22px) 16px calc(var(--safe-b) + 20px);gap:14px}
.fd{font-family:var(--fd)}
h1,h2,h3{margin:0;font-family:var(--fd);line-height:1.15}
.muted{color:var(--muted)}.soft{color:var(--soft)}
.small{font-size:13px}.tiny{font-size:12px}
.grow{flex:1 1 auto;min-width:0}
.row{display:flex;align-items:center;gap:10px}
.col{display:flex;flex-direction:column;gap:8px}
.center{text-align:center;align-items:center;justify-content:center}

/* بطاقات وأزرار */
.card{background:var(--card);border-radius:var(--r);box-shadow:0 2px 0 var(--line);padding:16px}
.list{background:var(--card);border-radius:var(--r);box-shadow:0 2px 0 var(--line);display:flex;flex-direction:column;overflow:hidden}
.list>*{padding:12px 14px;border-top:1px solid var(--line2);display:flex;align-items:center;gap:10px;min-height:56px;text-align:start;width:100%}
.list>*:first-child{border-top:0}
.label{font-size:13px;font-weight:600;color:var(--muted);padding:0 6px;margin-bottom:-6px}
.btn{height:52px;border-radius:16px;padding:0 18px;font-weight:600;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--accent);color:#fff;transition:transform .08s}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.5}
.btn.block{width:100%}
.btn.brand{background:var(--brand)}
.btn.orange{background:var(--orange);box-shadow:0 3px 0 #B84A0C}
.btn.ghost{background:var(--accent-soft);color:var(--accent-ink)}
.btn.line{background:var(--card);border:2px solid var(--line);color:var(--ink)}
.btn.danger{background:var(--danger-soft);color:var(--danger)}
.btn.sm{height:42px;font-size:14px;border-radius:13px;padding:0 14px}
.icb{width:46px;height:46px;border-radius:15px;background:var(--card);color:var(--ink);box-shadow:0 2px 0 var(--line);display:inline-flex;align-items:center;justify-content:center;flex:none}
.icb.flat{box-shadow:none;background:var(--bg)}
.ic{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
.pill{font-size:11px;color:var(--muted);background:var(--chip);padding:4px 10px;border-radius:99px;white-space:nowrap}
.wamd{background:var(--orange);color:#fff;font-size:9px;font-weight:700;letter-spacing:.08em;padding:2px 8px;border-radius:99px;direction:ltr;display:inline-block}
.field{display:flex;flex-direction:column;gap:6px}
.field span{font-size:13px;color:var(--muted)}
.inp{height:54px;border:2px solid var(--line);border-radius:16px;padding:0 16px;font:inherit;font-size:17px;background:var(--card);color:var(--ink);width:100%;outline:none}
.inp:focus{border-color:var(--accent)}
.inp.code{font-size:22px;font-weight:700;letter-spacing:.1em;text-align:center;direction:ltr;background:var(--bg)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{height:44px;padding:0 16px;border-radius:14px;background:var(--bg);font-size:15px;border:2px solid transparent}
.chip.on{background:var(--accent);color:#fff;font-weight:600}
.tog{width:52px;height:32px;border-radius:99px;background:var(--togoff);position:relative;flex:none;transition:background .15s}
.tog::after{content:'';position:absolute;top:3px;right:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:right .15s}
.tog.on{background:var(--accent)}.tog.on::after{right:23px}
.err{color:var(--danger);font-size:14px;min-height:20px;text-align:center}

/* الصور الرمزية */
.av{border-radius:50%;flex:none;display:inline-flex;align-items:center;justify-content:center;overflow:hidden;font-family:var(--fd);font-weight:700;color:#fff;position:relative}
.av svg,.av img{width:100%;height:100%;display:block;object-fit:cover}

/* مين معنا */
.who{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.who button{background:var(--card);border-radius:24px;padding:18px 10px;display:flex;flex-direction:column;align-items:center;gap:10px;box-shadow:0 2px 0 var(--line)}
.who button b{font-size:18px;font-weight:600;display:flex;align-items:center;gap:6px}
.who button:last-child:nth-child(odd){grid-column:span 2}

/* الرئيسية */
.chatcard{display:flex;align-items:center;gap:14px;padding:16px;border-radius:26px;background:var(--card);box-shadow:0 2px 0 var(--line);text-align:start;width:100%;color:var(--ink)}
.chatcard.fam{background:var(--accent);box-shadow:none;color:#fff}
.chatcard .nm{font-family:var(--fd);font-size:22px;font-weight:700;line-height:1.1}
.chatcard .pv{font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chatcard.fam .pv{color:#E6F6F6}
.badge{min-width:36px;height:36px;padding:0 10px;border-radius:99px;background:#E5252A;color:#fff;font-weight:800;font-size:18px;display:inline-flex;align-items:center;justify-content:center;flex:none;border:3px solid var(--card);box-shadow:0 3px 10px rgba(229,37,42,.45);animation:bpop 1.8s ease-in-out infinite}
.cardwrap{border-radius:26px;background:var(--card);box-shadow:0 2px 0 var(--line);overflow:hidden;position:relative}
.cardwrap::before{content:"";position:absolute;inset-block:14px;inset-inline-start:0;width:5px;border-radius:0 6px 6px 0;background:var(--cc)}
.cardwrap .chatcard{box-shadow:none;border-radius:0}
.cardwrap:has(.fam)::before{display:none}
.cardwrap:has(.fam){background:transparent;box-shadow:0 6px 18px -8px var(--cc)}
.cardwrap.hot{box-shadow:0 0 0 3px var(--cc),0 8px 20px -10px var(--cc);animation:hot 2.4s ease-in-out infinite}
@keyframes hot{50%{transform:scale(1.012)}}
.ring{display:inline-flex;border-radius:50%;padding:3px;background:var(--cc,var(--wc));flex:none}
.ring .av{border:3px solid var(--card)}
.ring.sm{padding:2px}.ring.sm .av{border-width:2px}
.chatcard .when{color:var(--soft);white-space:nowrap}
.chatcard.fam .when{color:#D2EFEF}
.quick{display:flex;gap:6px;padding:0 14px 12px;padding-inline-start:90px}
.quick button{flex:1;height:38px;border-radius:12px;background:var(--bg);font-size:13.5px;font-weight:700;color:var(--ink)}
.cardwrap:has(.fam) .quick{background:linear-gradient(135deg,var(--cc),color-mix(in srgb,var(--cc) 72%,#000));margin-top:-1px}
.cardwrap:has(.fam) .quick button{background:rgba(255,255,255,.18);color:#fff}
.chatcard.fam .badge{border-color:#fff;box-shadow:0 3px 12px rgba(0,0,0,.35)}
@keyframes bpop{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@media (prefers-reduced-motion:reduce){.badge{animation:none}}
.homeic{width:62px;height:62px;border-radius:22px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;flex:none}
.notice{border-radius:20px;padding:14px 16px;display:flex;align-items:center;gap:12px;font-size:14px;line-height:1.55}
.notice.warm{background:var(--warm-bg);color:var(--warm-ink)}
.notice.blue{background:var(--brand-soft);color:var(--brand-ink)}
.notice.red{background:var(--danger-soft);color:var(--danger)}

/* المحادثة */
.chat{height:100vh;height:100dvh;display:flex;flex-direction:column;padding:0}
.chathead{background:var(--card);padding:calc(var(--safe-t) + 12px) 12px 12px;display:flex;align-items:center;gap:10px;box-shadow:0 1px 0 var(--line);z-index:2}
.chathead .t{font-family:var(--fd);font-size:20px;font-weight:700;line-height:1.1}
.msgs{flex:1 1 auto;overflow-y:auto;padding:14px 12px 10px;background-color:var(--bg);background-image:radial-gradient(circle at 1px 1px,color-mix(in srgb,var(--wc) 22%,transparent) 1.4px,transparent 1.6px),linear-gradient(color-mix(in srgb,var(--wc) 7%,transparent),color-mix(in srgb,var(--wc) 7%,transparent));background-size:22px 22px,auto;display:flex;flex-direction:column;gap:8px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.day{align-self:center;font-size:12px;color:var(--muted);background:var(--chip);padding:3px 12px;border-radius:99px;margin:6px 0}
.m{display:flex;gap:8px;align-items:flex-end;max-width:84%}
.m.me{align-self:flex-end;flex-direction:row-reverse}
.m .who2{font-size:12px;font-weight:600;margin:0 6px 2px}
.bub{background:var(--card);border-radius:20px 20px 20px 6px;padding:9px 13px;box-shadow:0 1px 0 var(--line);font-size:17px;line-height:1.55;word-wrap:break-word;white-space:pre-wrap;position:relative}
.m:not(.me) .bub:not(.media){background:color-mix(in srgb,var(--sc) 13%,var(--card));box-shadow:0 1px 0 color-mix(in srgb,var(--sc) 30%,var(--line))}
.m:last-child .bub,.m:last-child .stkmsg{animation:pop .28s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.85);opacity:.4}}
.qr{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:0 2px}
.qr::-webkit-scrollbar{display:none}
.qr[hidden]{display:none}
.qr button{flex:none;height:36px;padding:0 13px;border-radius:99px;background:var(--bg);border:1.5px solid var(--line);font-size:14.5px;font-weight:600;color:var(--ink);white-space:nowrap}
.qr button:active{transform:scale(.94);background:var(--chip)}
.m.me .bub{background:var(--accent);color:#fff;border-radius:20px 20px 6px 20px;box-shadow:none}
.bub.media{padding:6px}
.bub.emo,.m.me .bub.emo{background:none;box-shadow:none;padding:0 2px;line-height:1.2;letter-spacing:2px;color:inherit}
.bub img{display:block;max-width:min(240px,62vw);max-height:300px;border-radius:14px;background:#fff}
.meta{font-size:11px;color:var(--soft);display:flex;align-items:center;gap:4px;margin:2px 6px 0}
.m.me .meta{justify-content:flex-start}
.tick{width:16px;height:16px;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.voice{display:flex;align-items:center;gap:10px;min-width:200px;padding:2px}
.voice .pl{width:44px;height:44px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;flex:none}
.m.me .voice .pl{background:#fff}
.wave{display:flex;align-items:center;gap:2px;height:30px;flex:1}
.wave i{display:block;width:3px;border-radius:2px;background:var(--wave)}
.wave i.on{background:var(--accent)}
.m.me .wave i{background:rgba(255,255,255,.45)}.m.me .wave i.on{background:#fff}
.dur{font-size:12px;color:var(--soft);font-variant-numeric:tabular-nums;flex:none}
.m.me .dur{color:#E6F6F6}
.compose{background:var(--card);padding:10px 10px calc(var(--safe-b) + 10px);display:flex;flex-direction:column;gap:8px;box-shadow:0 -1px 0 var(--line)}
.tools{display:flex;gap:8px}
.tools button{flex:1;height:46px;border-radius:15px;font-size:15px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px}
.tools .dr{background:var(--orange-soft);color:var(--draw-ink)}
.tools .ph{background:var(--photo-bg);color:var(--photo-ink)}
.tools .st{background:#F3E8FF;color:#6B21A8}
:root[data-theme="dark"] .tools .st{background:#3B2A55;color:#E9D5FF}
.reacts{position:absolute;bottom:-14px;inset-inline-start:8px;background:var(--card);border-radius:99px;padding:1px 7px;font-size:15px;box-shadow:0 1px 4px rgba(27,35,51,.22);display:flex;gap:2px;align-items:center;white-space:nowrap;color:var(--ink)}
.reacts i{font-style:normal;font-size:11px;font-weight:700;margin-inline-start:1px}
.m:has(.reacts) .meta{margin-top:16px}
.reactbar{position:fixed;z-index:60;background:var(--card);border-radius:99px;padding:6px 8px;box-shadow:0 8px 28px rgba(27,35,51,.28);display:flex;gap:2px;animation:up .15s}
.reactbar button{width:44px;height:44px;border-radius:50%;font-size:28px;line-height:1;display:flex;align-items:center;justify-content:center;transition:transform .12s}
.reactbar button:active{transform:scale(1.3)}
.reactbar button.on{background:var(--chip)}
.stkmsg{position:relative}
.stkmsg img{width:150px;height:150px;display:block}
.m.sched .bub{opacity:.7;border:2px dashed rgba(255,255,255,.7)}
.stkgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.stkgrid button{aspect-ratio:1;border-radius:16px;background:var(--card);display:flex;align-items:center;justify-content:center;padding:4px}
.agrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.agrid button{aspect-ratio:1;border-radius:14px;overflow:hidden;position:relative;background:var(--card);padding:0}
.agrid img{width:100%;height:100%;object-fit:cover;display:block}
.agrid .stkc img{object-fit:contain;padding:6px}
.agrid button>span{position:absolute;bottom:4px;inset-inline-start:4px}
.vbar{position:absolute;bottom:calc(var(--safe-b) + 18px);inset-inline:16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.starburst{position:fixed;inset:0;z-index:70;background:rgba(27,35,51,.55);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#fff;font-size:22px;text-align:center;padding:24px;animation:fade .2s}
.sb-star{font-size:120px;line-height:1;animation:sbpop .9s cubic-bezier(.2,1.6,.4,1)}
.starburst i{position:absolute;font-style:normal;font-size:26px;left:50%;top:45%;animation:sbfly 1.4s ease-out forwards}
.starburst i:nth-of-type(1){--x:-140px;--y:-160px}.starburst i:nth-of-type(2){--x:130px;--y:-150px}.starburst i:nth-of-type(3){--x:-170px;--y:20px}.starburst i:nth-of-type(4){--x:170px;--y:30px}.starburst i:nth-of-type(5){--x:-90px;--y:170px}.starburst i:nth-of-type(6){--x:100px;--y:160px}.starburst i:nth-of-type(7){--x:0;--y:-210px}.starburst i:nth-of-type(8){--x:-60px;--y:-90px}.starburst i:nth-of-type(9){--x:70px;--y:-80px}.starburst i:nth-of-type(10){--x:-200px;--y:-60px}.starburst i:nth-of-type(11){--x:200px;--y:-50px}.starburst i:nth-of-type(12){--x:20px;--y:200px}.starburst i:nth-of-type(13){--x:-30px;--y:120px}
@keyframes sbpop{0%{transform:scale(0) rotate(-40deg)}100%{transform:scale(1) rotate(0)}}
@keyframes sbfly{0%{transform:translate(-50%,-50%) scale(.3);opacity:1}100%{transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) scale(1.2);opacity:0}}
.fxrow{display:flex;gap:6px;align-items:center;justify-content:center;padding:4px 0 10px;flex-wrap:wrap}
.fxl{font-size:13px;font-weight:700;color:var(--ink)}
.fxrow button{height:40px;padding:0 13px;border-radius:99px;background:var(--chip);font-size:13px;font-weight:600;color:var(--muted)}
.fxrow button.on{background:var(--ink);color:var(--card)}
.sendrow{display:flex;gap:8px;align-items:flex-end}
.txt{flex:1;min-height:54px;max-height:140px;border-radius:27px;background:var(--bg);border:0;padding:14px 18px;font:inherit;font-size:17px;resize:none;outline:none;color:var(--ink)}
.mic{width:58px;height:58px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 4px 0 #0A6365}
.mic .ic{width:28px;height:28px}
.recbar{display:flex;align-items:center;gap:10px;height:58px}
.recdot{width:12px;height:12px;border-radius:50%;background:#E5484D;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}
.nudgecard{background:var(--orange-soft);border:2px solid #F9C9A9;border-radius:22px;padding:14px;display:flex;flex-direction:column;gap:10px;color:var(--orange-ink);align-self:stretch}
.prog{display:flex;gap:6px;align-items:center}
.prog i{flex:1;height:8px;border-radius:99px;background:#F9C9A9}
.prog i.on{background:var(--orange)}

/* الرسم */
.drawwrap{flex:1;background:#fff;border-radius:28px;box-shadow:0 2px 0 var(--line);overflow:hidden;touch-action:none;position:relative;min-height:300px}
.drawwrap canvas{width:100%;height:100%;display:block;touch-action:none}
.colors{display:flex;justify-content:space-between;gap:6px}
.colors button{width:42px;height:42px;border-radius:50%;border:3px solid var(--card)}
.colors button.on{outline:3px solid var(--ink)}
.sizes [data-s],.sizes #er{width:48px;height:48px;border-radius:14px;background:var(--bg);display:flex;align-items:center;justify-content:center;border:2px solid transparent;flex:none}
.sizes [data-s].on,.sizes #er.on{border-color:var(--ink)}
.dtools{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.dtools button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:14px;font-size:11px;font-weight:600;color:var(--muted);background:var(--bg);border:2px solid transparent}

/* النوافذ السفلية */
.sheet{position:fixed;inset:0;z-index:40;background:rgba(27,35,51,.45);display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}

@keyframes fade{from{opacity:0}}

.pinpad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
